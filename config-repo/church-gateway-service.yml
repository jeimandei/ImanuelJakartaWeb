server:
  port: 8089
  error:
    whitelabel:
      enabled: false

spring:
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# All backend calls route through the API gateway on :8080
services:
  auth-service:
    url: http://localhost:8080
  user-service:
    url: http://localhost:8080
  cms-service:
    url: http://localhost:8080
  event-service:
    url: http://localhost:8080
  media-service:
    url: http://localhost:8080
  interaction-service:
    url: http://localhost:8080
  audit-service:
    url: http://localhost:8080

logging:
  level:
    com.jeimandei: DEBUG
    org.springframework.security: INFO
    org.springframework.web.client: DEBUG
