server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/users/**,/api/roles/**,/api/permissions/**,/api/permission-categories/**

        - id: cms-service
          uri: ${CMS_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/cms/**,/api/announcements/**,/api/news/**,/api/settings/**,/api/service-times/**

        - id: event-service
          uri: ${EVENT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/events/**

        - id: media-service-sermons
          uri: ${MEDIA_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/sermons/**

        - id: media-service-livestreams
          uri: ${MEDIA_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/livestreams/**

        - id: media-service-gallery
          uri: ${MEDIA_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/gallery/**

        - id: interaction-service
          uri: ${INTERACTION_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/prayer-requests/**,/api/contact-messages/**,/api/newsletter/**,/api/testimonies/**,/api/volunteer/**

        - id: audit-service
          uri: ${AUDIT_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/audit/**

        - id: frontend
          uri: ${FRONTEND_URI:http://localhost:8089}
          predicates:
            - Path=/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.jeimandei: INFO
    org.springframework.cloud.gateway: INFO
