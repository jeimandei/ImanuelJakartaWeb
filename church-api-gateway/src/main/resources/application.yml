server:
  port: 8080

spring:
  application:
    name: church-api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**

        - id: cms-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/cms/**,/api/announcements/**,/api/news/**,/api/settings/**

        - id: event-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/events/**

        - id: media-service-sermons
          uri: http://localhost:8085
          predicates:
            - Path=/api/sermons/**

        - id: media-service-livestreams
          uri: http://localhost:8085
          predicates:
            - Path=/api/livestreams/**

        - id: media-service-gallery
          uri: http://localhost:8085
          predicates:
            - Path=/api/gallery/**

        - id: interaction-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/prayer-requests/**,/api/contact-messages/**,/api/newsletter/**,/api/testimonies/**,/api/volunteer/**

        - id: audit-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/audit/**

        # All other requests (public site, admin UI) go to the Thymeleaf frontend
        - id: frontend
          uri: http://localhost:8089
          predicates:
            - Path=/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.jeimandei: INFO
    org.springframework.cloud.gateway: INFO
