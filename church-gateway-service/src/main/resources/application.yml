server:
  port: 8089
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: church-gateway-service
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

services:
  auth-service:
    url: http://localhost:8080
  user-service:
    url: http://localhost:8080
  cms-service:
    url: http://localhost:8080
  event-service:
    url: http://localhost:8080
  media-service:
    url: http://localhost:8080
  interaction-service:
    url: http://localhost:8080
  audit-service:
    url: http://localhost:8080

jwt:
  secret: 3JkWpV9nR7mQfLxTzYsA2bDcEhGiJuKoNvPwSyUaBdFeHjIlMnOqRtVxZy1235467890ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz
  expiration: 86400000

logging:
  level:
    com.jeimandei: DEBUG
    org.springframework.security: INFO
    org.springframework.web.client: DEBUG
