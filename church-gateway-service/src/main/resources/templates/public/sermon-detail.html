<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sermon')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<!-- Page Header -->
<section style="background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color:white; padding:70px 0;">
    <div class="container text-center">
        <span class="badge mb-3 px-3 py-2" style="background:var(--accent); color:var(--primary-dark); font-size:0.85rem;"
              th:if="${sermon.seriesName != null and !sermon.seriesName.empty}"
              th:text="${sermon.seriesName}">Series Name</span>
        <h1 class="display-5 fw-bold mb-2" th:text="${sermon.title}">Sermon Title</h1>
        <p class="lead mb-0" style="opacity:0.85;">
            <i class="fas fa-user me-2"></i>
            <span th:text="${sermon.speaker}">Speaker Name</span>
            <span class="mx-3 opacity-50">|</span>
            <i class="fas fa-calendar me-2"></i>
            <span th:text="${#temporals.format(sermon.sermonDate, 'dd MMMM yyyy')}">Date</span>
        </p>
    </div>
</section>

<div class="container py-5">

    <!-- YouTube Embed -->
    <div th:if="${sermon.youtubeUrl != null and !sermon.youtubeUrl.empty}" class="mb-5">
        <div class="livestream-container shadow">
            <iframe th:src="${sermon.youtubeUrl}"
                    title="Sermon Video"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
            </iframe>
        </div>
    </div>

    <div class="row g-4">
        <!-- Sermon Details -->
        <div class="col-lg-4">
            <div class="card form-card p-4 mb-4">
                <h5 class="fw-bold mb-4" style="color:var(--primary);">
                    <i class="fas fa-info-circle me-2" style="color:var(--accent);"></i>Sermon Details
                </h5>
                <ul class="list-unstyled mb-0">
                    <li class="d-flex align-items-start mb-3">
                        <i class="fas fa-user me-3 mt-1" style="color:var(--accent); width:16px;"></i>
                        <div>
                            <small class="text-muted d-block">Speaker</small>
                            <strong th:text="${sermon.speaker}">Speaker Name</strong>
                        </div>
                    </li>
                    <li class="d-flex align-items-start mb-3">
                        <i class="fas fa-calendar me-3 mt-1" style="color:var(--accent); width:16px;"></i>
                        <div>
                            <small class="text-muted d-block">Date</small>
                            <strong th:text="${#temporals.format(sermon.sermonDate, 'dd MMMM yyyy')}">Date</strong>
                        </div>
                    </li>
                    <li th:if="${sermon.scriptureReference != null and !sermon.scriptureReference.empty}"
                        class="d-flex align-items-start mb-3">
                        <i class="fas fa-bible me-3 mt-1" style="color:var(--accent); width:16px;"></i>
                        <div>
                            <small class="text-muted d-block">Scripture</small>
                            <strong th:text="${sermon.scriptureReference}">John 3:16</strong>
                        </div>
                    </li>
                    <li th:if="${sermon.seriesName != null and !sermon.seriesName.empty}"
                        class="d-flex align-items-start mb-3">
                        <i class="fas fa-bookmark me-3 mt-1" style="color:var(--accent); width:16px;"></i>
                        <div>
                            <small class="text-muted d-block">Series</small>
                            <strong th:text="${sermon.seriesName}">Series Name</strong>
                        </div>
                    </li>
                    <li th:if="${sermon.audioUrl != null and !sermon.audioUrl.empty}"
                        class="d-flex align-items-start">
                        <i class="fas fa-headphones me-3 mt-1" style="color:var(--accent); width:16px;"></i>
                        <div>
                            <small class="text-muted d-block">Audio</small>
                            <a th:href="${sermon.audioUrl}" target="_blank" class="fw-medium">
                                <i class="fas fa-play me-1"></i>Listen
                            </a>
                        </div>
                    </li>
                </ul>
            </div>

            <!-- Actions -->
            <div class="d-grid gap-2">
                <a th:if="${sermon.youtubeUrl != null and !sermon.youtubeUrl.empty}"
                   th:href="${sermon.youtubeUrl}" target="_blank"
                   class="btn btn-danger">
                    <i class="fab fa-youtube me-2"></i>Watch on YouTube
                </a>
                <a th:href="@{/sermons}" class="btn btn-outline-primary">
                    <i class="fas fa-arrow-left me-2"></i>Back to Sermons
                </a>
            </div>
        </div>

        <!-- Sermon Description -->
        <div class="col-lg-8">
            <div class="card form-card p-4">
                <h5 class="fw-bold mb-4" style="color:var(--primary);">
                    <i class="fas fa-align-left me-2" style="color:var(--accent);"></i>About This Message
                </h5>
                <div th:if="${sermon.description != null and !sermon.description.empty}"
                     class="text-muted" style="line-height:1.8; font-size:1.05rem;"
                     th:text="${sermon.description}">
                    Sermon description will appear here.
                </div>
                <div th:if="${sermon.description == null or sermon.description.empty}"
                     class="text-center text-muted py-4">
                    <i class="fas fa-file-alt fa-2x mb-3 opacity-50"></i>
                    <p class="mb-0">No description available for this sermon.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
</body>
</html>
