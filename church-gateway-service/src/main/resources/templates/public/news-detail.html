<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('News')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<!-- Page Header -->
<section style="background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color:white; padding:70px 0;">
    <div class="container text-center">
        <div class="mb-3">
            <span class="badge px-3 py-2 me-2"
                  style="background:var(--accent); color:var(--primary-dark); font-size:0.85rem;">
                <i class="fas fa-newspaper me-1"></i>News
            </span>
        </div>
        <h1 class="display-5 fw-bold mb-3" th:text="${article.title}">Article Title</h1>
        <div class="d-flex gap-4 justify-content-center" style="opacity:0.85;">
            <span th:if="${article.publishedAt != null}">
                <i class="fas fa-calendar me-2"></i>
                <span th:text="${#temporals.format(article.publishedAt, 'dd MMMM yyyy')}">01 January 2025</span>
            </span>
        </div>
    </div>
</section>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- Featured Image -->
            <div th:if="${article.imageUrl != null and !article.imageUrl.empty}" class="mb-5">
                <img th:src="${article.imageUrl}" th:alt="${article.title}"
                     class="w-100 rounded-3 shadow"
                     style="max-height:450px; object-fit:cover;"/>
            </div>

            <!-- Article Content -->
            <div class="card form-card p-4 p-lg-5">
                <!-- Excerpt / Lead -->
                <div th:if="${article.excerpt != null and !article.excerpt.empty}"
                     class="lead text-muted mb-4 pb-4 border-bottom"
                     th:text="${article.excerpt}">
                    Article excerpt / summary.
                </div>

                <!-- Full Content (HTML) -->
                <div class="article-content" style="line-height:1.9; font-size:1.05rem;"
                     th:utext="${article.content}">
                    Article full content will be rendered here.
                </div>

                <!-- Footer Meta -->
                <hr class="mt-5 mb-4"/>
                <div class="d-flex flex-wrap gap-3 align-items-center justify-content-between">
                    <div class="text-muted small">
                        <i class="fas fa-tag me-1"></i>
                        <span th:text="${article.status}">PUBLISHED</span>
                        <span th:if="${article.publishedAt != null}" class="ms-2">
                            &bull; Published on
                            <span th:text="${#temporals.format(article.publishedAt, 'dd MMM yyyy')}">01 Jan 2025</span>
                        </span>
                    </div>
                    <a th:href="@{/news}" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-arrow-left me-2"></i>Back to News
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
</body>
</html>
