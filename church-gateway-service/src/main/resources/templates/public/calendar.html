<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Events Calendar')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<!-- Page Header -->
<section style="background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color:white; padding:80px 0;">
    <div class="container text-center">
        <i class="fas fa-calendar-alt fa-3x mb-3" style="opacity:0.8;"></i>
        <h1 class="display-5 fw-bold mb-2">Events Calendar</h1>
        <p class="lead mb-0" style="opacity:0.85;">See everything happening in our community at a glance</p>
    </div>
</section>

<!-- Calendar -->
<section class="py-5">
    <div class="container">

        <!-- View Toggle -->
        <div class="d-flex justify-content-end mb-4">
            <div class="btn-group" role="group" aria-label="Events view toggle">
                <a th:href="@{/events}" class="btn btn-outline-primary">
                    <i class="fas fa-th-list me-1"></i>List
                </a>
                <a th:href="@{/calendar}" class="btn btn-primary">
                    <i class="fas fa-calendar-alt me-1"></i>Calendar
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-3 p-md-4">
                <div id="calendar"></div>
            </div>
        </div>

        <p class="text-muted small text-center mt-3">
            <i class="fas fa-info-circle me-1"></i>
            Click an event to view its details.
        </p>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');
        if (!calendarEl) {
            return;
        }
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            timeZone: 'Asia/Jakarta',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,listMonth'
            },
            buttonText: {
                today: 'Today',
                month: 'Month',
                week: 'Week',
                list: 'List'
            },
            height: 'auto',
            navLinks: true,
            dayMaxEvents: true,
            events: /*[[@{/calendar/feed}]]*/ '/calendar/feed',
            eventClick: function (info) {
                if (info.event.url) {
                    info.jsEvent.preventDefault();
                    window.location.href = info.event.url;
                }
            }
        });
        calendar.render();
    });
</script>
</body>
</html>
