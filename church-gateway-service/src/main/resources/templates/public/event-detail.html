<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Event Detail')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<!-- Banner Image -->
<div th:if="${event.imageUrl != null and !event.imageUrl.empty}">
    <img th:src="${event.imageUrl}" th:alt="${event.title}" class="w-100"
         style="max-height:400px; object-fit:cover; display:block;"/>
</div>

<div th:if="${event.imageUrl == null or event.imageUrl.empty}"
     style="background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); height:200px; display:flex; align-items:center; justify-content:center;">
    <i class="fas fa-calendar-alt fa-5x text-white opacity-25"></i>
</div>

<div class="container py-5">
    <div class="row g-4">
        <!-- Event Main Info -->
        <div class="col-lg-8">
            <div class="card form-card p-4 p-lg-5">
                <!-- Status Badge -->
                <div class="mb-3" th:if="${event.status != null}">
                    <span class="badge px-3 py-2"
                          th:text="${event.status}"
                          th:classappend="${event.status == 'PUBLISHED' ? 'bg-success' :
                                          (event.status == 'DRAFT' ? 'bg-warning text-dark' : 'bg-secondary')}">
                        PUBLISHED
                    </span>
                    <span th:if="${event.featured}" class="badge ms-2 px-3 py-2"
                          style="background:var(--accent); color:var(--primary-dark);">
                        <i class="fas fa-star me-1"></i>Featured
                    </span>
                </div>

                <!-- Title -->
                <h1 class="fw-bold mb-4" style="color:var(--primary);" th:text="${event.title}">Event Title</h1>

                <!-- Date & Location Details -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6" th:if="${event.eventStart != null}">
                        <div class="d-flex align-items-start">
                            <i class="fas fa-calendar me-3 mt-1" style="color:var(--accent); font-size:1.2rem;"></i>
                            <div>
                                <small class="text-muted d-block fw-medium text-uppercase">Date &amp; Time</small>
                                <strong th:text="${#temporals.format(event.eventStart, 'EEEE, dd MMMM yyyy')}">Monday, 01 January 2025</strong><br/>
                                <span class="text-muted small">
                                    <span th:text="${#temporals.format(event.eventStart, 'HH:mm')}">08:00</span>
                                    <span th:if="${event.eventEnd != null}">
                                        – <span th:text="${#temporals.format(event.eventEnd, 'HH:mm')}">10:00</span> WIB
                                    </span>
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6" th:if="${event.location != null and !event.location.empty}">
                        <div class="d-flex align-items-start">
                            <i class="fas fa-map-marker-alt me-3 mt-1" style="color:var(--accent); font-size:1.2rem;"></i>
                            <div>
                                <small class="text-muted d-block fw-medium text-uppercase">Location</small>
                                <strong th:text="${event.location}">Venue Name</strong>
                            </div>
                        </div>
                    </div>
                </div>

                <hr class="my-4"/>

                <!-- Description -->
                <h5 class="fw-bold mb-3" style="color:var(--primary);">About This Event</h5>
                <div th:if="${event.description != null and !event.description.empty}"
                     class="text-muted" style="line-height:1.8; font-size:1.05rem;"
                     th:text="${event.description}">
                    Event description will appear here.
                </div>
                <div th:if="${event.description == null or event.description.empty}"
                     class="text-center text-muted py-3">
                    <i class="fas fa-info-circle fa-2x mb-2 opacity-50"></i>
                    <p class="mb-0">No additional details available for this event.</p>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="col-lg-4">
            <!-- Quick Details Card -->
            <div class="card form-card p-4 mb-4">
                <h6 class="fw-bold mb-3" style="color:var(--primary);">
                    <i class="fas fa-info me-2" style="color:var(--accent);"></i>Quick Details
                </h6>
                <ul class="list-unstyled mb-0 small">
                    <li th:if="${event.eventStart != null}" class="mb-2">
                        <i class="fas fa-clock me-2 text-muted"></i>
                        <span th:text="${#temporals.format(event.eventStart, 'HH:mm')}">08:00</span> WIB
                    </li>
                    <li th:if="${event.location != null and !event.location.empty}" class="mb-2">
                        <i class="fas fa-map-marker-alt me-2 text-muted"></i>
                        <span th:text="${event.location}">Location</span>
                    </li>
                    <li th:if="${event.status != null}" class="mb-2">
                        <i class="fas fa-tag me-2 text-muted"></i>
                        <span th:text="${event.status}">Status</span>
                    </li>
                </ul>
            </div>

            <!-- Back Button -->
            <a th:href="@{/events}" class="btn btn-outline-primary w-100 mb-3">
                <i class="fas fa-arrow-left me-2"></i>Back to Events
            </a>
            <a th:href="@{/contact}" class="btn btn-primary w-100">
                <i class="fas fa-envelope me-2"></i>Contact Us
            </a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
</body>
</html>
