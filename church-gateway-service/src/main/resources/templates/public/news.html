<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('News & Updates')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<!-- Page Header -->
<section style="background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color:white; padding:80px 0;">
    <div class="container text-center">
        <i class="fas fa-newspaper fa-3x mb-3" style="opacity:0.8;"></i>
        <h1 class="display-5 fw-bold mb-2">News &amp; Updates</h1>
        <p class="lead mb-0" style="opacity:0.85;">Stories and updates from our church community</p>
    </div>
</section>

<!-- News Listing -->
<section class="py-5">
    <div class="container">

        <!-- Articles Grid -->
        <div th:if="${articles != null and articles.content != null and !articles.content.empty}">
            <div class="row g-4">
                <div th:each="article : ${articles.content}" class="col-md-6 col-lg-4">
                    <div class="card h-100">
                        <!-- Article Image -->
                        <div th:if="${article.imageUrl != null and !article.imageUrl.empty}">
                            <img th:src="${article.imageUrl}" class="card-img-top" th:alt="${article.title}"
                                 onerror="this.parentElement.innerHTML='<div class=\'card-img-top bg-primary d-flex align-items-center justify-content-center\' style=\'height:200px;\'><i class=\'fas fa-newspaper fa-3x text-white opacity-50\'></i></div>'"/>
                        </div>
                        <div th:if="${article.imageUrl == null or article.imageUrl.empty}"
                             class="card-img-top d-flex align-items-center justify-content-center"
                             style="height:200px; background: linear-gradient(135deg, var(--primary), var(--primary-light));">
                            <i class="fas fa-newspaper fa-3x text-white opacity-50"></i>
                        </div>

                        <div class="card-body p-4 d-flex flex-column">
                            <!-- Meta -->
                            <div class="d-flex align-items-center gap-2 mb-3">
                                <i class="fas fa-calendar-alt text-muted small"></i>
                                <small class="text-muted"
                                       th:text="${article.publishedAt != null ? #temporals.format(article.publishedAt, 'dd MMM yyyy') : 'Draft'}">
                                    01 Jan 2025
                                </small>
                            </div>

                            <!-- Title -->
                            <h5 class="card-title mb-2" th:text="${article.title}">Article Title</h5>

                            <!-- Excerpt -->
                            <p th:if="${article.excerpt != null and !article.excerpt.empty}"
                               class="text-muted small flex-grow-1 mb-3"
                               th:text="${#strings.abbreviate(article.excerpt, 160)}">
                                Article excerpt...
                            </p>
                            <p th:if="${(article.excerpt == null or article.excerpt.empty) and (article.content != null and !article.content.empty)}"
                               class="text-muted small flex-grow-1 mb-3"
                               th:text="${#strings.abbreviate(article.content, 160)}">
                                Article content excerpt...
                            </p>
                        </div>
                        <div class="card-footer bg-transparent p-3">
                            <a th:href="@{/news/{slug}(slug=${article.slug})}" class="btn btn-primary btn-sm">
                                Read More <i class="fas fa-arrow-right ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <nav th:if="${articles.totalPages > 1}" class="mt-5" aria-label="News pagination">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${articles.page == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/news(page=${articles.page - 1})}">
                            <i class="fas fa-chevron-left"></i> Previous
                        </a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, articles.totalPages - 1)}"
                        class="page-item"
                        th:classappend="${i == articles.page ? 'active' : ''}">
                        <a class="page-link" th:href="@{/news(page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${articles.page + 1 >= articles.totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/news(page=${articles.page + 1})}">
                            Next <i class="fas fa-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Empty State -->
        <div th:if="${articles == null or articles.content == null or articles.content.empty}"
             class="text-center py-5">
            <i class="fas fa-newspaper fa-4x mb-4 text-muted opacity-50"></i>
            <h4 class="text-muted mb-2">No Articles Yet</h4>
            <p class="text-muted mb-4">No news articles have been published yet. Check back soon!</p>
            <a th:href="@{/}" class="btn btn-outline-primary">
                <i class="fas fa-home me-2"></i>Back to Home
            </a>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
</body>
</html>
