<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments/head :: head('Create User - Admin')}"></head>
<body>
<div class="d-flex">

    <nav class="admin-sidebar d-none d-md-flex flex-column py-3">
        <div class="admin-sidebar-header mb-3">
            <div class="brand"><i class="fas fa-church me-2"></i>Church Admin</div>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" th:href="@{/admin}"><i class="fas fa-tachometer-alt"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/admin/users}"><i class="fas fa-users"></i>Users</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/cms}"><i class="fas fa-file-alt"></i>CMS Pages</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/events}"><i class="fas fa-calendar-alt"></i>Events</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/sermons}"><i class="fas fa-microphone"></i>Sermons</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/livestreams}"><i class="fas fa-broadcast-tower"></i>Livestreams</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/announcements}"><i class="fas fa-bullhorn"></i>Announcements</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/news}"><i class="fas fa-newspaper"></i>News</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/gallery}"><i class="fas fa-images"></i>Gallery</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/prayer-requests}"><i class="fas fa-hands"></i>Prayer Requests</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/contacts}"><i class="fas fa-envelope"></i>Contacts</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/settings}"><i class="fas fa-cog"></i>Settings</a></li>
        </ul>
    </nav>

    <div class="admin-content flex-grow-1">
        <div class="admin-topbar">
            <h5 class="mb-0 fw-bold" style="color:var(--primary);">
                <i class="fas fa-user-plus me-2" style="color:var(--accent);"></i>Create User
            </h5>
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted small"><i class="fas fa-user me-1"></i><span sec:authentication="name">Admin</span></span>
                <form th:action="@{/logout}" method="post" class="mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-sm btn-outline-danger" type="submit">Logout</button>
                </form>
            </div>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="p-4">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card form-card">
                        <div class="card-header bg-white border-bottom py-3 px-4">
                            <h6 class="mb-0 fw-bold" style="color:var(--primary);">
                                <i class="fas fa-user-plus me-2" style="color:var(--accent);"></i>New User Account
                            </h6>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/admin/users}" method="post" th:object="${userForm}" novalidate>
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                                <div class="row g-3">
                                    <!-- Full Name -->
                                    <div class="col-12">
                                        <label class="form-label fw-medium">Full Name <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                                            <input type="text" th:field="*{fullName}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('fullName') ? 'is-invalid' : ''}"
                                                   placeholder="Full name" required/>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                                 th:errors="*{fullName}">Name error</div>
                                        </div>
                                    </div>

                                    <!-- Username -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium">Username <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-at"></i></span>
                                            <input type="text" th:field="*{username}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('username') ? 'is-invalid' : ''}"
                                                   placeholder="username" required/>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                                                 th:errors="*{username}">Username error</div>
                                        </div>
                                    </div>

                                    <!-- Email -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium">Email <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                            <input type="email" th:field="*{email}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}"
                                                   placeholder="email@example.com" required/>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                                 th:errors="*{email}">Email error</div>
                                        </div>
                                    </div>

                                    <!-- Phone -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium">Phone</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                            <input type="tel" th:field="*{phone}" class="form-control" placeholder="+62 xxx-xxxx-xxxx"/>
                                        </div>
                                    </div>

                                    <!-- Role -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium">Role <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-user-tag"></i></span>
                                            <select th:field="*{role}" class="form-select" required>
                                                <option value="">-- Select Role --</option>
                                                <option value="ROLE_MEMBER">Member</option>
                                                <option value="ROLE_EDITOR">Editor</option>
                                                <option value="ROLE_ADMIN">Admin</option>
                                                <option value="ROLE_SUPER_ADMIN">Super Admin</option>
                                            </select>
                                        </div>
                                    </div>

                                    <!-- Password -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium">Password <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                            <input type="password" th:field="*{password}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}"
                                                   placeholder="Min 8 characters" required/>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                                 th:errors="*{password}">Password error</div>
                                        </div>
                                    </div>

                                    <!-- Confirm Password -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-medium">Confirm Password <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                            <input type="password" th:field="*{confirmPassword}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('confirmPassword') ? 'is-invalid' : ''}"
                                                   placeholder="Repeat password" required/>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                                                 th:errors="*{confirmPassword}">Confirm password error</div>
                                        </div>
                                    </div>

                                    <!-- Buttons -->
                                    <div class="col-12 d-flex gap-2 pt-2">
                                        <button type="submit" class="btn btn-primary px-4">
                                            <i class="fas fa-user-plus me-2"></i>Create User
                                        </button>
                                        <a th:href="@{/admin/users}" class="btn btn-outline-secondary px-4">Cancel</a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
</body>
</html>
