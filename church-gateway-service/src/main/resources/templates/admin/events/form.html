<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments/head :: head('Event Form - Admin')}"></head>
<body>
<div class="d-flex">

    <nav class="admin-sidebar d-none d-md-flex flex-column py-3">
        <div class="admin-sidebar-header mb-3">
            <div class="brand"><i class="fas fa-church me-2"></i>Church Admin</div>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" th:href="@{/admin}"><i class="fas fa-tachometer-alt"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/users}"><i class="fas fa-users"></i>Users</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/roles}"><i class="fas fa-user-shield"></i>Roles</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/permissions}"><i class="fas fa-key"></i>Permissions</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/cms}"><i class="fas fa-file-alt"></i>CMS Pages</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/admin/events}"><i class="fas fa-calendar-alt"></i>Events</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/sermons}"><i class="fas fa-microphone"></i>Sermons</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/livestreams}"><i class="fas fa-broadcast-tower"></i>Livestreams</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/announcements}"><i class="fas fa-bullhorn"></i>Announcements</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/news}"><i class="fas fa-newspaper"></i>News</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/gallery}"><i class="fas fa-images"></i>Gallery</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/prayer-requests}"><i class="fas fa-hands"></i>Prayer Requests</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/contacts}"><i class="fas fa-envelope"></i>Contacts</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/audit-logs}"><i class="fas fa-clipboard-list"></i>Audit Logs</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/settings}"><i class="fas fa-cog"></i>Settings</a></li>
        </ul>
    </nav>

    <div class="admin-content flex-grow-1">
        <div class="admin-topbar">
            <h5 class="mb-0 fw-bold" style="color:var(--primary);">
                <i class="fas fa-calendar-alt me-2" style="color:var(--accent);"></i>
                <span th:text="${eventForm?.id != null ? 'Edit Event' : 'Create Event'}">Create Event</span>
            </h5>
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted small"><i class="fas fa-user me-1"></i><span sec:authentication="name">Admin</span></span>
                <form th:action="@{/logout}" method="post" class="mb-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-sm btn-outline-danger" type="submit">Logout</button>
                </form>
            </div>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="p-4">
            <div class="card" style="max-width:800px;">
                <div class="card-body p-4">
                    <form th:action="${eventForm?.id != null} ? @{/admin/events/{id}/edit(id=${eventForm.id})} : @{/admin/events/create}" method="post" th:object="${eventForm}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row g-3">
                            <!-- Title -->
                            <div class="col-12">
                                <label class="form-label fw-medium">Title <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{title}" class="form-control"
                                       th:classappend="${#fields.hasErrors('title') ? 'is-invalid' : ''}"
                                       placeholder="Event title" required/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                            </div>

                            <!-- Slug -->
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Slug</label>
                                <input type="text" th:field="*{slug}" class="form-control"
                                       placeholder="event-slug-here"/>
                                <div class="form-text">URL-friendly identifier. Leave blank to auto-generate.</div>
                            </div>

                            <!-- Status -->
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Status</label>
                                <select th:field="*{status}" class="form-select">
                                    <option value="DRAFT">Draft</option>
                                    <option value="PUBLISHED">Published</option>
                                    <option value="CANCELLED">Cancelled</option>
                                </select>
                            </div>

                            <!-- Description -->
                            <div class="col-12">
                                <label class="form-label fw-medium">Description</label>
                                <textarea th:field="*{description}" class="form-control" rows="5"
                                          placeholder="Full event description..."></textarea>
                            </div>

                            <!-- Location -->
                            <div class="col-12">
                                <label class="form-label fw-medium">Location</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                                    <input type="text" th:field="*{location}" class="form-control"
                                           placeholder="Event location or venue"/>
                                </div>
                            </div>

                            <!-- Event Start -->
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Event Start <span class="text-danger">*</span></label>
                                <input type="datetime-local" th:field="*{eventStart}" class="form-control"
                                       th:classappend="${#fields.hasErrors('eventStart') ? 'is-invalid' : ''}"
                                       required/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('eventStart')}" th:errors="*{eventStart}"></div>
                            </div>

                            <!-- Event End -->
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Event End</label>
                                <input type="datetime-local" th:field="*{eventEnd}" class="form-control"/>
                            </div>

                            <!-- Image URL -->
                            <div class="col-12">
                                <label class="form-label fw-medium">Image URL</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-image"></i></span>
                                    <input type="url" th:field="*{imageUrl}" class="form-control"
                                           placeholder="https://example.com/event-image.jpg"/>
                                </div>
                            </div>

                            <!-- Featured -->
                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input type="checkbox" th:field="*{featured}" class="form-check-input" id="featured"/>
                                    <label for="featured" class="form-check-label fw-medium">
                                        <i class="fas fa-star me-1" style="color:var(--accent);"></i>
                                        Feature this event on the homepage
                                    </label>
                                </div>
                            </div>

                            <!-- Buttons -->
                            <div class="col-12 d-flex gap-2 pt-2">
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="fas fa-save me-2"></i>Save Event
                                </button>
                                <a th:href="@{/admin/events}" class="btn btn-outline-secondary px-4">Cancel</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
</body>
</html>
