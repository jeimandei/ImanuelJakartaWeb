<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('403 - Access Denied')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center py-5">
            <div class="mb-4">
                <i class="fas fa-lock fa-5x" style="color:var(--primary); opacity:0.6;"></i>
            </div>
            <h1 class="display-4 fw-bold" style="color:var(--primary);">403</h1>
            <h2 class="h3 fw-semibold text-dark mb-3">Access Denied</h2>
            <p class="text-muted mb-4 lead">
                You don't have permission to access this page. Please contact an administrator
                if you believe this is an error.
            </p>
            <div class="d-flex gap-3 justify-content-center">
                <a th:href="@{/}" class="btn btn-primary btn-lg px-4">
                    <i class="fas fa-home me-2"></i>Back to Home
                </a>
                <a th:href="@{/contact}" class="btn btn-outline-secondary btn-lg px-4">
                    <i class="fas fa-envelope me-2"></i>Contact Us
                </a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
</body>
</html>
