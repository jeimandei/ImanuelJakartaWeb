<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Reset Password')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <i class="fas fa-lock-open fa-3x mb-3" style="color:var(--primary);"></i>
                <h2 class="fw-bold" style="color:var(--primary);">Reset Password</h2>
                <p class="text-muted">We'll send a one-time code to your email</p>
            </div>

            <div class="card form-card">
                <div class="card-body p-4">

                    <!-- Flash messages -->
                    <div th:if="${successMessage}" class="alert alert-success">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${successMessage}"></span>
                    </div>
                    <div th:if="${infoMessage}" class="alert alert-info">
                        <i class="fas fa-info-circle me-2"></i>
                        <span th:text="${infoMessage}"></span>
                    </div>
                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <!-- Step 1: enter email / username -->
                    <div th:if="${fpIdentifier == null and otpStep == null}">
                        <p class="text-muted small mb-3">
                            Enter the email address or username linked to your account.
                        </p>
                        <form th:action="@{/forgot-password}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="mb-3">
                                <label class="form-label fw-medium">Email or Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" name="identifier" class="form-control"
                                           placeholder="Enter your email or username" required autofocus/>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                <i class="fas fa-paper-plane me-2"></i>Send OTP
                            </button>
                        </form>
                    </div>

                    <!-- Step 2: enter OTP + new password -->
                    <div th:if="${fpIdentifier != null or otpStep != null}">
                        <p class="text-muted small mb-3">
                            Enter the 6-digit OTP sent to your email along with your new password.
                        </p>
                        <form th:action="@{/forgot-password/reset}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="identifier"
                                   th:value="${fpIdentifier}"/>

                            <div class="mb-3">
                                <label class="form-label fw-medium">OTP Code <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                                    <input type="text" name="otp" class="form-control"
                                           placeholder="6-digit code" maxlength="6"
                                           pattern="[0-9]{6}" required autofocus
                                           style="letter-spacing:0.3em; font-size:1.1rem;"/>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-medium">New Password <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" name="newPassword" id="newPassword"
                                           class="form-control" placeholder="Min 8 characters"
                                           minlength="8" required/>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-medium">Confirm New Password <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" name="confirmPassword" id="confirmPassword"
                                           class="form-control" placeholder="Repeat new password"
                                           minlength="8" required/>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                <i class="fas fa-check me-2"></i>Reset Password
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <a th:href="@{/forgot-password}" class="text-muted small">
                                <i class="fas fa-arrow-left me-1"></i>Start over
                            </a>
                        </div>
                    </div>

                </div>
                <div class="card-footer text-center bg-transparent">
                    <p class="mb-0">Remembered your password?
                        <a th:href="@{/login}" class="fw-semibold">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
<script>
    (function() {
        var np = document.getElementById('newPassword');
        var cp = document.getElementById('confirmPassword');
        if (cp) {
            cp.addEventListener('input', function() {
                if (np.value !== cp.value) {
                    cp.setCustomValidity('Passwords do not match');
                } else {
                    cp.setCustomValidity('');
                }
            });
        }
    })();
</script>
</body>
</html>
