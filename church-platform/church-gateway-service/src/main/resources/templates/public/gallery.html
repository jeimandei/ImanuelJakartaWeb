<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Photo Gallery')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<!-- Page Header -->
<section style="background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color:white; padding:80px 0;">
    <div class="container text-center">
        <i class="fas fa-images fa-3x mb-3" style="opacity:0.8;"></i>
        <h1 class="display-5 fw-bold mb-2">Photo Gallery</h1>
        <p class="lead mb-0" style="opacity:0.85;">Moments of faith, fellowship, and ministry</p>
    </div>
</section>

<!-- Album Filter Tabs -->
<section class="py-3 bg-light border-bottom" th:if="${albumNames != null and !albumNames.empty}">
    <div class="container">
        <ul class="nav nav-pills flex-wrap gap-2 justify-content-center">
            <li class="nav-item">
                <a class="nav-link"
                   th:classappend="${param.album == null ? 'active' : ''}"
                   th:href="@{/gallery}">
                    <i class="fas fa-th me-1"></i>All Albums
                </a>
            </li>
            <li th:each="album : ${albumNames}" class="nav-item">
                <a class="nav-link"
                   th:classappend="${param.album != null and param.album[0] == album ? 'active' : ''}"
                   th:href="@{/gallery(album=${album})}"
                   th:text="${album}">Album Name</a>
            </li>
        </ul>
    </div>
</section>

<!-- Gallery Grid -->
<section class="py-5">
    <div class="container">

        <!-- Items -->
        <div th:if="${galleryItems != null and galleryItems.content != null and !galleryItems.content.empty}">
            <div class="row g-3">
                <div th:each="item : ${galleryItems.content}" class="col-md-4 col-sm-6">
                    <div class="card h-100">
                        <div class="position-relative overflow-hidden" style="border-radius:8px 8px 0 0;">
                            <img th:src="${item.imageUrl}" th:alt="${item.title}"
                                 class="gallery-img"
                                 onerror="this.src='/images/gallery-placeholder.jpg'"/>
                            <div class="position-absolute bottom-0 start-0 p-2" th:if="${item.albumName != null}">
                                <span class="badge"
                                      style="background:var(--accent); color:var(--primary-dark); font-size:0.72rem;"
                                      th:text="${item.albumName}">Album Name</span>
                            </div>
                        </div>
                        <div class="card-body p-3" th:if="${item.title != null and !item.title.empty}">
                            <p class="card-title mb-0 small fw-medium" th:text="${item.title}">Photo Title</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <nav th:if="${galleryItems.totalPages > 1}" class="mt-5" aria-label="Gallery pagination">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${galleryItems.page == 0 ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/gallery(page=${galleryItems.page - 1}, album=${param.album})}">
                            <i class="fas fa-chevron-left"></i> Previous
                        </a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, galleryItems.totalPages - 1)}"
                        class="page-item"
                        th:classappend="${i == galleryItems.page ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/gallery(page=${i}, album=${param.album})}"
                           th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item"
                        th:classappend="${galleryItems.page + 1 >= galleryItems.totalPages ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/gallery(page=${galleryItems.page + 1}, album=${param.album})}">
                            Next <i class="fas fa-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Empty State -->
        <div th:if="${galleryItems == null or galleryItems.content == null or galleryItems.content.empty}"
             class="text-center py-5">
            <i class="fas fa-images fa-4x mb-4 text-muted opacity-50"></i>
            <h4 class="text-muted mb-2">No Photos Yet</h4>
            <p class="text-muted mb-4">No gallery photos have been added yet. Check back soon!</p>
            <a th:href="@{/gallery}" class="btn btn-outline-primary">
                <i class="fas fa-redo me-2"></i>View All Albums
            </a>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
</body>
</html>
