<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Register')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="text-center mb-4">
                <i class="fas fa-user-plus fa-3x mb-3" style="color:var(--primary);"></i>
                <h2 class="fw-bold" style="color:var(--primary);">Join Our Community</h2>
                <p class="text-muted">Create your account to connect with our church</p>
            </div>
            <div class="card form-card">
                <div class="card-body p-4">
                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <span th:text="${errorMessage}">Error</span>
                    </div>
                    <form th:action="@{/register}" method="post" th:object="${registerForm}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">Username *</label>
                                <input type="text" th:field="*{username}" class="form-control"
                                       th:classappend="${#fields.hasErrors('username') ? 'is-invalid' : ''}"
                                       placeholder="Choose username" required/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                                     th:errors="*{username}">Username error</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">Full Name *</label>
                                <input type="text" th:field="*{fullName}" class="form-control"
                                       th:classappend="${#fields.hasErrors('fullName') ? 'is-invalid' : ''}"
                                       placeholder="Your full name" required/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                     th:errors="*{fullName}">Name error</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-medium">Email Address *</label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}"
                                   placeholder="Your email" required/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">Email error</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-medium">Phone Number</label>
                            <input type="tel" th:field="*{phoneNumber}" class="form-control"
                                   placeholder="+62 xxx-xxxx-xxxx"/>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">Password *</label>
                                <input type="password" th:field="*{password}" class="form-control"
                                       th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}"
                                       placeholder="Min. 8 characters" required/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                     th:errors="*{password}">Password error</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">Confirm Password *</label>
                                <input type="password" th:field="*{confirmPassword}" class="form-control"
                                       placeholder="Repeat password" required/>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="fas fa-user-plus me-2"></i>Create Account
                        </button>
                    </form>
                </div>
                <div class="card-footer text-center bg-transparent">
                    <p class="mb-0">Already have an account? <a th:href="@{/login}" class="fw-semibold">Sign in here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
</body>
</html>
