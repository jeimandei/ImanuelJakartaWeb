<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Church Events')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<!-- Page Header -->
<section style="background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color:white; padding:80px 0;">
    <div class="container text-center">
        <i class="fas fa-calendar-alt fa-3x mb-3" style="opacity:0.8;"></i>
        <h1 class="display-5 fw-bold mb-2">Church Events</h1>
        <p class="lead mb-0" style="opacity:0.85;">Stay connected with what God is doing in our community</p>
    </div>
</section>

<!-- Events Listing -->
<section class="py-5">
    <div class="container">

        <!-- Events Grid -->
        <div th:if="${events != null and events.content != null and !events.content.empty}">
            <div class="row g-4">
                <div th:each="event : ${events.content}" class="col-md-6 col-lg-4">
                    <div class="card h-100">
                        <!-- Event Image -->
                        <div th:if="${event.imageUrl != null and !event.imageUrl.empty}" class="position-relative">
                            <img th:src="${event.imageUrl}" class="card-img-top" th:alt="${event.title}"
                                 onerror="this.parentElement.innerHTML='<div class=\'card-img-top bg-primary d-flex align-items-center justify-content-center\' style=\'height:200px;\'><i class=\'fas fa-calendar-alt fa-3x text-white opacity-50\'></i></div>'"/>
                        </div>
                        <div th:if="${event.imageUrl == null or event.imageUrl.empty}"
                             class="card-img-top d-flex align-items-center justify-content-center"
                             style="height:200px; background: linear-gradient(135deg, var(--primary), var(--primary-light));">
                            <i class="fas fa-calendar-alt fa-3x text-white opacity-50"></i>
                        </div>

                        <div class="card-body p-4">
                            <!-- Date Badge + Title -->
                            <div class="d-flex align-items-start gap-3 mb-3">
                                <div class="event-date-badge flex-shrink-0"
                                     th:if="${event.eventStart != null}">
                                    <div class="day" th:text="${#temporals.format(event.eventStart, 'dd')}">01</div>
                                    <div class="month" th:text="${#temporals.format(event.eventStart, 'MMM')}">JAN</div>
                                </div>
                                <div>
                                    <h5 class="card-title mb-1" th:text="${event.title}">Event Title</h5>
                                    <p class="text-muted small mb-0" th:if="${event.location != null and !event.location.empty}">
                                        <i class="fas fa-map-marker-alt me-1"></i>
                                        <span th:text="${event.location}">Location</span>
                                    </p>
                                </div>
                            </div>

                            <!-- Description Excerpt -->
                            <p class="text-muted small mb-0"
                               th:if="${event.description != null and !event.description.empty}"
                               th:text="${#strings.abbreviate(event.description, 150)}">
                                Event description excerpt...
                            </p>
                        </div>
                        <div class="card-footer bg-transparent p-3">
                            <a th:href="@{/events/{slug}(slug=${event.slug})}" class="btn btn-primary btn-sm">
                                Learn More <i class="fas fa-arrow-right ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <nav th:if="${events.totalPages > 1}" class="mt-5" aria-label="Events pagination">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${events.page == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/events(page=${events.page - 1})}">
                            <i class="fas fa-chevron-left"></i> Previous
                        </a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, events.totalPages - 1)}"
                        class="page-item"
                        th:classappend="${i == events.page ? 'active' : ''}">
                        <a class="page-link" th:href="@{/events(page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${events.page + 1 >= events.totalPages ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/events(page=${events.page + 1})}">
                            Next <i class="fas fa-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Empty State -->
        <div th:if="${events == null or events.content == null or events.content.empty}"
             class="text-center py-5">
            <i class="fas fa-calendar-times fa-4x mb-4 text-muted opacity-50"></i>
            <h4 class="text-muted mb-2">No Events Scheduled</h4>
            <p class="text-muted mb-4">There are no upcoming events at this time. Please check back soon!</p>
            <a th:href="@{/}" class="btn btn-outline-primary">
                <i class="fas fa-home me-2"></i>Back to Home
            </a>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
</body>
</html>
